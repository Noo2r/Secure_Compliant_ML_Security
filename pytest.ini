[pytest]
# Scopes bare `pytest` invocations to the real, collected test suite.
# compliance/tests/test_compliance.py (Farida's Milestone 4 deliverable, kept
# verbatim/unmodified -- see compliance/README.md) is intentionally excluded:
# it doesn't exercise real project code (see tests/test_compliance_real.py's
# module docstring for why), and without this scoping, pytest's default
# rootdir-wide discovery would also try to collect it, which fails outright
# with an import error since both tests/ and compliance/tests/ are __init__.py
# packages named "tests".
testpaths = tests
